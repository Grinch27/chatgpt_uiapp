<!doctype html>
<!-- 待确认：真实 host 布局；歧义：无；后续：真机；优化：无；风险/验证：320px 和长文本换行。 -->
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Decision Block</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif;background:light-dark(#fff,#191919);color:light-dark(#202124,#eee)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:16px;overflow-wrap:anywhere}form{max-width:1100px;margin:auto}header{font-size:17px;font-weight:650;margin-bottom:12px}
fieldset{border:0;border-bottom:1px solid light-dark(#e5e7eb,#444);margin:0;padding:12px 0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}legend{float:left;max-width:100%;padding:0;font-weight:600}.options{display:flex;flex-wrap:wrap;gap:6px 12px;min-width:0}label{display:flex;align-items:baseline;gap:7px;padding:5px 9px;border-radius:6px;cursor:pointer;max-width:100%;background:light-dark(#f5f6f8,#292b30)}label:has(input:checked){background:light-dark(#e4ecff,#263d67)}input{accent-color:#3467d5;margin:0;flex-shrink:0}input:focus-visible{outline:2px solid #3467d5;outline-offset:3px}output{display:block;min-height:44px;padding:12px 0;font-family:ui-monospace,monospace;white-space:pre-wrap}footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{font:inherit;border:1px solid #8b929f;border-radius:7px;padding:7px 16px;cursor:pointer}button[type=submit]{background:#285ecc;color:white;border-color:#285ecc}button:disabled{opacity:.5;cursor:not-allowed}#status{margin:8px 0 0;min-height:21px;color:light-dark(#536174,#b9c3d3)}
</style></head><body><form><header>决策选择</header><div id="questions"></div><output aria-label="选择结果" aria-live="polite"></output><footer><button id="reset" type="button" disabled>重置</button><button id="submit" type="submit" disabled>提交</button></footer><p id="status" role="status">等待问题数据…</p></form><script>/*WIDGET_SCRIPT*/</script></body></html>
